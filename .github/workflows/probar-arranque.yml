# Abre la app en un emulador de Android y guarda el registro (logcat), para
# ver por qué se cierra al abrir. Se lanza a mano.
name: Probar arranque

on:
  workflow_dispatch:

jobs:
  arranque:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Liberar espacio en disco
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Letras
        continue-on-error: true
        run: |
          base=https://raw.githubusercontent.com/google/fonts/main/ofl
          cd assets/google_fonts
          for f in patrickhand/PatrickHand-Regular.ttf mali/Mali-Regular.ttf mali/Mali-Medium.ttf \
                   mali/Mali-SemiBold.ttf mali/Mali-Bold.ttf itim/Itim-Regular.ttf \
                   gaegu/Gaegu-Regular.ttf gaegu/Gaegu-Bold.ttf; do
            curl -fsSL -o "$(basename $f)" "$base/$f" || echo "sin $f"
          done
      - name: Crear carpetas de Android
        run: |
          flutter create . --project-name app_notas --org com.appnotas --platforms android
          rm -f test/widget_test.dart
          python3 tool/setup_android.py
          echo "== archivos kotlin =="; find android/app/src -name "*.kt" -o -name "*.java" | xargs ls -la
          echo "== manifiesto =="; grep -n "Kumo\|activity\|receiver" android/app/src/main/AndroidManifest.xml
          echo "== gradle =="; cat android/app/build.gradle.kts
      - name: Dependencias
        run: |
          flutter pub get
          dart run build_runner build
          flutter pub deps --style=compact | grep -i "mlkit\|notification" || true
      - name: Compilar APK x86_64
        run: |
          echo "org.gradle.jvmargs=-Xmx4g" >> android/gradle.properties
          flutter build apk --release --split-per-abi --target-platform android-x64
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-x86_64-release.apk
            adb logcat -c
            adb shell am start -n com.appnotas.app_notas/.MainActivity
            sleep 25
            adb logcat -d > logcat.txt || true
            grep -n -A40 "FATAL EXCEPTION\|AndroidRuntime" logcat.txt | head -150 || true
            grep -n "flutter" logcat.txt | head -80 || true
            adb shell pidof com.appnotas.app_notas && echo "SIGUE ABIERTA" || echo "SE CERRO"
            adb exec-out screencap -p > pantalla.png || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arranque
          path: |
            logcat.txt
            pantalla.png
