name: app_notas
description: App de notas con grabación, transcripción, fotos y video.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Base de datos local (offline-first)
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Audio
  record: ^6.0.0
  just_audio: ^0.9.42

  # Transcripción en el dispositivo (whisper.cpp)
  whisper_ggml: ^2.9.0

  # Fotos y video
  image_picker: ^1.1.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
