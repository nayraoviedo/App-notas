name: app_notas
description: App de notas con grabación, transcripción, fotos y video.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegación
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0

  # Base de datos local (offline-first)
  drift: ^2.22.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1

  # Audio
  record: ^6.0.0
  just_audio: ^0.9.42

  # Transcripción en el dispositivo (whisper.cpp)
  whisper_ggml: ^2.9.0

  # Fotos y video
  image_picker: ^1.1.2
  # Cámara dentro de la app (la del sistema hacía que Android cerrara la app)
  camera: ^0.11.0
  # Accesos rápidos al mantener presionado el ícono
  quick_actions: ^1.0.0
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  youtube_player_iframe: ^6.0.4

  # Dibujo a mano, fuentes y modelo de voz
  perfect_freehand: ^2.5.2
  google_fonts: ^6.2.1
  sherpa_onnx: ^2.0.0

  # Importar PDF y archivos
  pdfx: ^2.9.0
  file_picker: ^8.1.4

  # Compartir y convertir audios
  share_plus: ">=11.0.0 <14.0.0"
  ffmpeg_kit_flutter_new_min: any

  # Ajustes, IA en la nube y exportar
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  pdf: ^3.11.1
  printing: ^5.13.4

  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.0

flutter:
  uses-material-design: true
  assets:
    # Obras de dominio público para las portadas (se bajan al compilar).
    - assets/covers/
    - assets/stickers/
    - assets/home/
